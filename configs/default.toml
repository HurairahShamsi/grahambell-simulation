# GrahamBell Stage 1 — default configuration.
#
# This file mirrors `Config::default()` in crates/gb-config; a test fails if they differ.
# Each protocol parameter is `{ value, status, sweep }`:
#   status  D = decided, P = proposed (compare against the alternative), O = open (sweep it).
#   sweep   `values` lists sweep/comparison values; `range` is an inclusive [min, max].
# A parameter without `value` has the SPEC default "—" (not yet chosen).
#
# To run with different values, write a small file containing only the keys you change, e.g.
#   [genesis]
#   ids.value = 5000000
# and pass it with `gb analytic --config my.toml`. Status tags cannot be changed.

# ---------------------------------------------------------------- SPEC §2: hash pacing
[pacing]
hashes_per_second = { value = 1.0, status = "D" }

# ---------------------------------------------------------------- SPEC §2, §3.5, §3.7–§3.9: PoW-ID issuance
[issuance]
pow_id_target_interval_s = { value = 30.0, status = "D" }
rate_mode = { value = "fixed", status = "P", sweep = { values = ["fixed", "adaptive"], note = "fixed is decided; adaptive is the proposed variant (SPEC §3.9)" } }
difficulty_variant = { value = "count_based", status = "D", sweep = { values = ["count_based", "bitcoin_retarget"], note = "Variant A (Bitcoin-style retarget) is the comparison (SPEC §3.8)" } }
retarget_window_blocks = { value = 144, status = "D" }
retarget_clamp_factor = { value = 4.0, status = "D" }
# Variant B correction [P]: none by default; M3 compares P1, P2 and B-exact.
count_based_correction = { value = { form = "accumulated", window_blocks = 144, bound = 0.5 }, status = "D", sweep = { values = [{ form = "recent_interval_ratio", window_blocks = 144, bound = 0.1 }, { form = "recent_interval_ratio", window_blocks = 144, bound = 0.25 }, { form = "recent_interval_ratio", window_blocks = 144, bound = 0.5 }, { form = "accumulated", window_blocks = 144, bound = 0.1 }, { form = "accumulated", window_blocks = 144, bound = 0.25 }, { form = "discrete_exact" }], note = "P2 x1.5 is the default since SPEC v0.7 (architect, 2026-10-21; M3a.1 E1/E2); no correction, P1 and P2 at other bounds and B-exact are comparisons" } }
difficulty_count_rule = { value = "issued_entropy", status = "D", sweep = { values = ["issued_entropy", "after_post_admission_wait", "all_globally_active", "issued_entropy_lagged"], note = "issued entropy is the default since SPEC v0.7 (architect, 2026-10-21; M3a.1 E1/E2); the count after the post-admission wait (the default until v0.6), all Globally Active miners and the lagged count are comparisons" } }
min_attack_time_floor_years = { value = 2.0, status = "P", sweep = { range = [1.0, 10.0] } }
cap_checkpoint_interval_fraction_of_t_min = { value = 1.0, status = "D", sweep = { values = [0.25, 0.5, 1.0] } }
cap_safety_factor = { value = { numerator = 7, denominator = 6 }, status = "D" }
confirmation_depth_blocks = { value = 6, status = "O", sweep = { range = [3, 12] } }
start_rule = { value = "r", status = "D", sweep = { values = ["r", "a", "b"], note = "rule (r) is the default since SPEC v0.7 (architect, 2026-10-21; M3a.1 E1); rule (a) (the default until v0.6) is the comparison, rule (b) the rejected alternative kept for S13" } }
same_height_tie_break = { value = "first_seen", status = "D", sweep = { values = ["first_seen", "lower_block_hash"], note = "first seen is the default since SPEC v0.7 (architect, 2026-10-21; M3a.1 E1); the v0.6 order is the comparison" } }

# ---------------------------------------------------------------- SPEC §2, §5: transaction layer
[transactions]
pow_tx_interval_s = { value = 10.0, status = "O", sweep = { range = [1.0, 10.0] } }

# ---------------------------------------------------------------- SPEC §2, §4.1, §4.2: Witness Chains and allocation
[witness]
wc_size = { value = 10, status = "D" }
subordinate_wcs_per_kwc = { value = 3, status = "D", sweep = { values = [3, 2], note = "1 + 2 (30 nodes) for comparison" } }
kwc_count_rule = { value = "equals_wc_count", status = "D" }
ring_offsets = { value = [1, 4, 6], status = "D" }
ring_offsets_30_node = { value = [1, 3], status = "D" }
allocation_beacon_delay_blocks = { value = 6, status = "O", sweep = { values = [3, 6, 12] } }
watched_registered_per_node = { value = 800, status = "D" }
watched_unregistered_per_node = { value = 200, status = "D" }

# ---------------------------------------------------------------- SPEC §2: PoWit quorums
[quorum]
registered_leader_min = { value = 7, status = "D" }
registered_subordinate_min = { value = 21, status = "D" }
registered_subordinate_min_30_node = { value = 14, status = "D" }
unregistered_total_min = { value = 27, status = "D" }
unregistered_total_min_30_node = { value = 20, status = "D" }

# ---------------------------------------------------------------- SPEC §2, §3.4: entropy lock
[entropy]
signers = { value = "all_online_members", status = "D", sweep = { values = ["all_online_members", "threshold_two_thirds", "threshold_majority"], note = "threshold entropy is the M3a.1 experiment (architect, 2026-10-14)" } }
equivocation_scope = { value = "same_height", status = "D", sweep = { values = ["same_height", "same_parent"], note = "same parent is the [P] comparison (architect, 2026-10-12)" } }

# ---------------------------------------------------------------- SPEC §2: capacity
[capacity]
miners_per_leader_wc = { value = 250, status = "D" }
unregistered_per_leader_wc = { value = 50, status = "O", sweep = { values = [50, 150, 235], note = "registered/unregistered split 200/50, 100/150, 15/235" } }
spare_target_fraction = { value = 0.33, status = "D" }

# ---------------------------------------------------------------- SPEC §2: network limits
[network]
node_request_rate_limit_per_s = { value = 1000, status = "D" }

# ---------------------------------------------------------------- SPEC §2: timing
[timing]
grace_epoch_rounds = { value = 5, status = "D" }
clock_tolerance_s = { value = 2.0, status = "O", sweep = { range = [0.5, 10.0] } }
# One Chance wait: one grace epoch (5 rounds) by default.
one_chance_wait_rounds = { value = 5, status = "O", sweep = { values = [1, 2, 5] } }
# PoWit deadline D: 10 s with the soft scope (architect, 2026-10-14). value = "none" turns it off.
powit_deadline_s ={ value = 10.0, status = "D", sweep = { values = [5.0, 10.0, 30.0, 60.0], note = "no deadline is the comparison (architect, 2026-10-14)" } }
powit_deadline_scope = { value = "not_extended_only", status = "D", sweep = { values = ["not_extended_only", "permanent"], note = "permanent is the comparison (architect, 2026-10-14)" } }
early_block = { value = "permanent", status = "D", sweep = { values = ["permanent", "reevaluate_later"], note = "re-evaluation is the comparison (architect, 2026-10-12)" } }
witness_signing = { value = "on_time", status = "D", sweep = { values = ["on_time", "earliest_within_tolerance"], note = "earliest within δ (the earlier P-4 reading) is the comparison" } }

# ---------------------------------------------------------------- SPEC §2, §3.1: admission
[admission]
post_admission_wait_rounds = { value = 5, status = "O", sweep = { range = [1, 10] } }
convergence_interval_epochs = { value = 1.0, status = "O", sweep = { range = [0.5, 3.0] } }
peer_bootstrap_count = { value = 8, status = "D", sweep = { range = [4, 8] } }
# Failover: rounds below quorum before a miner moves to a KWC that can issue entropy (off).
failover_after_rounds = { status = "P", sweep = { values = [2], note = "off by default; the M3a.1 experiment (architect, 2026-10-14)" } }

# ---------------------------------------------------------------- SPEC §2, §4.3: Chain Allocation Committee
[cac]
size = { value = 600, status = "D", sweep = { range = [100, 1000], note = "100–1,000 for comparison" } }
membership_policy = { value = "first_in_first_out", status = "D" }
join_every_n_tx_blocks = { value = 10, status = "D" }
seat_selection = { value = "lottery", status = "D", sweep = { values = ["lottery", "tenth_block_miner"], note = "the v0.2 rule (miner of every 10th PoW-Tx block) is the comparison" } }
lottery_beacon_offset_blocks = { value = 3, status = "O", sweep = { values = [1, 3, 6, 12] } }
approval_threshold = { value = { numerator = 2, denominator = 3 }, status = "D" }

# ---------------------------------------------------------------- SPEC §2: genesis
[genesis]
ids = { value = 2900000, status = "D", sweep = { values = [1000000, 2100000, 2900000, 5000000, 10000000] } }
distribution = { value = "kyc_one_per_verified_person", status = "D" }
secretly_controlled_fraction = { value = 0.0, status = "O", sweep = { range = [0.0, 0.2] } }

# ---------------------------------------------------------------- SPEC §2, §4.7: offline handling (seconds)
[offline]
deactivation_threshold_s = { status = "O", sweep = { values = [3600.0, 21600.0, 86400.0, 259200.0, 604800.0] } }
reactivation_wait_s = { status = "O", sweep = { values = [86400.0, 604800.0, 1209600.0, 2592000.0] } }
# Long-absence threshold L: 30 days; sweep 3, 7, 30, 90, 365 days.
long_absence_threshold_s = { value = 2592000.0, status = "O", sweep = { values = [259200.0, 604800.0, 2592000.0, 7776000.0, 31536000.0] } }
unreachable_rule = { value = "unreachable_is_not_refusal", status = "D", sweep = { values = ["unreachable_is_not_refusal", "strict"], note = "strict is the comparison (architect, 2026-10-14)" } }

# ---------------------------------------------------------------- SPEC §2, §4.8: penalties (seconds)
[penalties]
suspension_ladder_s = { value = [86400, 2592000], status = "D" }
final_step = { value = "permanent", status = "D" }
strict_offence = { value = "ladder", status = "D", sweep = { values = ["ladder", "ladder_yearly_reset", "immediate_ban"], note = "yearly reset is [P]; immediate ban is §4.6 read literally (architect, 2026-10-12)" } }
# Offline points (the M3a.1 experiment; off): points for every offline period of at least n,
# escalating by the steps (the last repeats) up to the cap; they reset 12 months of block time
# after the most recent point.
offline_points_after_s = { status = "O", sweep = { values = [3600.0, 21600.0, 86400.0], note = "off by default; n of the M3a.1 experiment (architect, 2026-10-14)" } }
offline_points_steps = { value = [1, 1, 2, 3, 4, 5], status = "O" }
offline_points_cap = { value = 20, status = "O" }
offline_points_reset_s = { value = 31536000.0, status = "O" }
offline_points_outcome = { value = "seat_loss", status = "O", sweep = { values = ["seat_loss", "blacklist"] } }
offline_points_seat_cooldown_s = { value = 2592000.0, status = "O" }

# ---------------------------------------------------------------- SPEC §2: cryptography
[crypto]
signature_scheme = { value = "bls12_381_aggregate_bitfield_pop", status = "D" }
hash_function = { value = "sha256", status = "P" }

# ================================================================ Modelling constants (not protocol parameters)
[model]
# 365-day year: R = 31,536,000 / 30 = 1,051,200 IDs per year.
seconds_per_year = 31536000

