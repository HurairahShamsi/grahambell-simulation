# ================================================================ M3 simulator settings (gb sim)
# Modelling inputs, not protocol parameters. Sources, or the label "illustrative", are listed
# in docs/ASSUMPTIONS.md (entries SIM-n). Latency comes from data/latency/region_rtt.csv
# (RIPE Atlas). Reliable grid: US EIA 2023 (SAIFI 1.3, SAIDI 366 min including major events).
# Unreliable grid: NEPRA's load-shedding bands (0-16 h/day by feeder losses); the feeder mix,
# fault rate and UPS values are illustrative.
[sim]
crypto_mode = "fast"
threads = 4
trace_sample = 0.0
# Memory bound of the acceptance cache (about 80 bytes an entry); never changes a result.
acceptance_cache_entries = 2000000

[sim.world]
registered_ids = 290000
winners_readmit = true
panel_nodes = 101
deactivation_threshold_s = 86400.0
# A run stops early, recorded as a fork storm, once more blocks than this are unsettled at once
